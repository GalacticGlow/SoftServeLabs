name: OpenFoodFacts CI/CD

on:
  pull_request:
    branches: [Lab9]

  push:
    branches: [Lab9]

  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and test dependencies
        run: python -m pip install -e ".[test]"

      - name: Run unit tests
        run: python -m pytest --cov

  bundle-validation:
    name: Bundle Validation
    runs-on: ubuntu-latest
    environment: prod

    env:
      DATABRICKS_AUTH_TYPE: azure-client-secret
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate production bundle
        run: databricks bundle validate -t prod

  deploy-prod:
    name: Deploy to Production
    needs: [unit-tests, bundle-validation]

    if: |
      (github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/Lab9'

    runs-on: ubuntu-latest
    environment: prod

    concurrency:
      group: openfoodfacts-prod-deploy
      cancel-in-progress: false

    env:
      DATABRICKS_AUTH_TYPE: azure-client-secret
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Deploy production bundle
        run: databricks bundle deploy -t prod

      - name: Verify deployed job
        run: databricks jobs list --output json
