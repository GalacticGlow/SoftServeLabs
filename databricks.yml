bundle:
  name: openfoodfacts_pipeline

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog for this environment

  staging_schema:
    description: Staging schema

  staging_volume:
    description: Volume containing raw source snapshots

  bronze_schema:
    description: Bronze schema

  silver_schema:
    description: Silver schema

  gold_schema:
    description: Gold schema

  reader_group:
    default: account users

  service_principal_name:
    default: d1a2118a-1d70-44cf-ba58-ea3454da6727

targets:
  dev:
    mode: development
    default: true

    workspace:
      host: https://adb-7405604651938730.10.azuredatabricks.net/

    variables:
      catalog: dbr_dev_ua5816bd
      staging_schema: gulidov_artem_staging
      staging_volume: raw_csv
      bronze_schema: gulidov_artem_bronze
      silver_schema: gulidov_artem_silver
      gold_schema: gulidov_artem_gold

  prod:
    mode: production

    run_as:
      service_principal_name: ${var.service_principal_name}
    
    permissions:
      - user_name: art.gulidov@softserve.academy
        level: CAN_MANAGE

      - service_principal_name: ${var.service_principal_name}
        level: CAN_MANAGE

    workspace:
      host: https://adb-7405604651938730.10.azuredatabricks.net/
      root_path: /Workspace/Users/art.gulidov@softserve.academy/.bundle/${bundle.name}/${bundle.target}

    variables:
      catalog: dbr_dev_ua5816bd
      staging_schema: prod_gulidov_artem_staging
      staging_volume: raw_csv
      bronze_schema: prod_gulidov_artem_bronze
      silver_schema: prod_gulidov_artem_silver
      gold_schema: prod_gulidov_artem_gold