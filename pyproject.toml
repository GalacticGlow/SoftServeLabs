[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "openfoodfacts-pipeline"
version = "0.1.0"
requires-python = ">=3.12,<3.13"

dependencies = [
    "pyspark==4.0.0",
    "delta-spark",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -p no:cacheprovider --assert=plain"

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
show_missing = true